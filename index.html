<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智汇航标 | 高频访问导航</title>
    <style>
        :root {
            --bg-side: #f8fafc;
            --bg-main: #ffffff;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --card-hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 侧边栏优化 --- */
        aside {
            width: 260px;
            background: var(--bg-side);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 32px 16px;
            transition: all 0.3s ease;
        }

        .brand {
            padding: 0 16px 32px;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .nav-group { flex-grow: 1; overflow-y: auto; }

        .nav-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
        }

        .nav-item:hover {
            background: rgba(0, 0, 0, 0.03);
            color: var(--text-main);
        }

        .nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
        }

        /* --- 主内容区 --- */
        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px 60px;
            scroll-behavior: smooth;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            z-index: 10;
            padding: 10px 0;
        }

        .current-category-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            padding-left: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-side);
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.5;
        }

        /* --- 卡片网格 --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
            border-color: transparent;
        }

        .logo-box {
            width: 48px;
            height: 48px;
            margin-right: 16px;
            border-radius: 12px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fallback-box {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .info { overflow: hidden; }
        .name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: fadeIn 0.4s ease forwards; }

        /* 响应式 */
        @media (max-width: 768px) {
            aside { width: 80px; padding: 20px 10px; }
            .brand, .nav-item { font-size: 0; justify-content: center; }
            .nav-item::before { content: '📁'; font-size: 1.2rem; }
            main { padding: 20px; }
            .top-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
            .search-box { width: 100%; }
        }
    </style>
</head>

    let currentCategory = navData[0].name;

    function handleLogoError(img) {
        img.style.display = 'none';
        img.nextElementSibling.style.display = 'flex';
    }

    function renderCategory(catName, filter = '') {
        const grid = document.getElementById('cardGrid');
        const title = document.getElementById('catTitle');
        const data = navData.find(c => c.name === catName);
        
        currentCategory = catName;
        title.textContent = catName;
        grid.innerHTML = '';
        
        const filteredSites = data.sites.filter(s => 
            s.name.toLowerCase().includes(filter.toLowerCase())
        );

        filteredSites.forEach((site, index) => {
            const domain = new URL(site.url).hostname;
            const card = document.createElement('a');
            card.href = site.url;
            card.target = "_blank";
            card.className = "card";
            card.style.animationDelay = `${index * 0.03}s`;
            card.innerHTML = `
                <div class="logo-box">
                    <img src="logos/${site.name}.png" onerror="handleLogoError(this)">
                    <div class="fallback-box" style="display:none">${site.name[0]}</div>
                </div>
                <div class="info">
                    <div class="name">${site.name}</div>
                    <div class="desc">${domain}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterSites() {
        const searchTerm = document.getElementById('searchInput').value;
        renderCategory(currentCategory, searchTerm);
    }

    function init() {
        const sideNav = document.getElementById('sideNav');
        navData.forEach((cat, idx) => {
            const btn = document.createElement('div');
            btn.className = `nav-item ${idx === 0 ? 'active' : ''}`;
            btn.textContent = cat.name;
            btn.onclick = () => {
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('searchInput').value = ''; // 切换分类清空搜索
                renderCategory(cat.name);
            };
            sideNav.appendChild(btn);
        });
        renderCategory(navData[0].name);
    }

    init();
